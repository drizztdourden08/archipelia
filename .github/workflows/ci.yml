name: CI
run-name: CI ${{ github.head_ref || github.ref_name }}

# Managed by brock sync from the targets in brock.config.ts. Change the targets, then run brock sync.
# Runs on pull requests and from the Actions tab. The review job launches the built app headless
# under xvfb and fails the run when a check in its report fails.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  APP_DIR: apps/desktop

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@drizztdourden08'

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build
        run: pnpm --dir "$APP_DIR" exec brock build

      - name: Release note
        run: pnpm --dir "$APP_DIR" exec brock release-notes check

      - name: App gate steps
        run: pnpm --dir "$APP_DIR" exec brock gate

      - name: Managed files match brock sync
        run: pnpm exec brock check

      - name: Lint and typecheck
        run: pnpm run lint

      - name: Markdown
        run: pnpm run --if-present lint:md

      - name: Structure
        run: pnpm exec brock structure --check

      - name: Tests
        run: pnpm run --if-present test
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@drizztdourden08'

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build
        run: pnpm --dir "$APP_DIR" exec brock build

      - name: Let Electron start its sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install xvfb
        run: command -v xvfb-run || { sudo apt-get update && sudo apt-get install -y xvfb; }

      - name: Headless review
        run: xvfb-run -a pnpm --dir "$APP_DIR" exec brock launch main none --prod --review

      - name: Keep the review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review
          path: .user-data/Data/review/
          if-no-files-found: ignore
